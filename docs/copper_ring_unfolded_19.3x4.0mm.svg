<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260mm" height="110mm" viewBox="0 0 260 110">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="260" height="110" fill="#ffffff"/>
  <text x="10" y="12" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#0f172a">
    Развёртка разрезного медного кольца GND / Радиатор (под PTFE OD 6,0 мм, лента 0,15–0,20 мм)
  </text>
  <text x="10" y="18" font-family="Arial, sans-serif" font-size="3.5" fill="#475569">
    Масштаб чертежа 10:1 (1 деление = 1 мм в реальном размере)
  </text>

  <!-- Контур кольца в масштабе 10:1 (смещение x=30, y=40; длина 19.3мм = 193, ширина 4.0мм = 40, язычок 3.0мм = 30 x 1.6мм = 16) -->
  <!-- Язычок слева: x from 10 to 40, y from 52 to 68 -->
  <!-- Основная полоса: x from 40 to 233, y from 40 to 80 -->
  <path d="M 40,40 L 233,40 L 233,80 L 40,80 L 40,68 L 12,68 Q 10,68 10,66 L 10,54 Q 10,52 12,52 L 40,52 Z"
        fill="#fed7aa" stroke="#9a3412" stroke-width="0.8"/>

  <!-- Прорезь справа: отступ от правого края 1.5мм (15 ед -> x=218), ширина прорези 0.35мм (3.5 ед -> x=214.5..218), длина 1.8мм (18 ед -> y=51..69) -->
  <rect x="214.5" y="51" width="3.5" height="18" fill="#ffffff" stroke="#9a3412" stroke-width="0.6"/>

  <!-- Осевая линия -->
  <line x1="6" y1="60" x2="238" y2="60" stroke="#64748b" stroke-width="0.3" stroke-dasharray="2,1"/>

  <!-- Размерные линии -->
  <!-- 3.0 мм язычок -->
  <line x1="10" y1="32" x2="40" y2="32" stroke="#1e293b" stroke-width="0.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="10" y1="52" x2="10" y2="30" stroke="#94a3b8" stroke-width="0.3"/>
  <line x1="40" y1="40" x2="40" y2="30" stroke="#94a3b8" stroke-width="0.3"/>
  <text x="25" y="30" font-family="Arial, sans-serif" font-size="3.5" text-anchor="middle" fill="#0f172a">3,0 мм</text>

  <!-- 19.3 мм рабочая длина -->
  <line x1="40" y1="32" x2="233" y2="32" stroke="#1e293b" stroke-width="0.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="233" y1="40" x2="233" y2="30" stroke="#94a3b8" stroke-width="0.3"/>
  <text x="136.5" y="30" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" text-anchor="middle" fill="#0f172a">
    19,3 мм (длина развёртки под Ø 6,0 мм)
  </text>

  <!-- Ширина 4.0 мм справа -->
  <line x1="243" y1="40" x2="243" y2="80" stroke="#1e293b" stroke-width="0.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="233" y1="40" x2="245" y2="40" stroke="#94a3b8" stroke-width="0.3"/>
  <line x1="233" y1="80" x2="245" y2="80" stroke="#94a3b8" stroke-width="0.3"/>
  <text x="246" y="61" font-family="Arial, sans-serif" font-size="3.5" fill="#0f172a">4,0 мм</text>

  <!-- Высота язычка 1.6 мм -->
  <text x="25" y="75" font-family="Arial, sans-serif" font-size="3.2" text-anchor="middle" fill="#7c2d12">Язычок 1,6 мм</text>

  <!-- Подпись прорези -->
  <line x1="216" y1="70" x2="205" y2="92" stroke="#1e293b" stroke-width="0.4"/>
  <text x="203" y="96" font-family="Arial, sans-serif" font-size="3.3" text-anchor="end" fill="#0f172a">
    Прорезь 1,8 × 0,35 мм (отступ 1,5 мм от края)
  </text>
  <text x="10" y="104" font-family="Arial, sans-serif" font-size="3.2" fill="#475569">
    Примечание: перед защёлкиванием вставить внутрь PTFE-трубки калибровочный стержень Ø 5,0 мм.
  </text>
</svg>