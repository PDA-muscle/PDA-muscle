<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Move Phase Emulator v20 — Auto Design</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        #mainHolder {
            display: grid;
            grid-template-rows: auto 1fr auto auto;
            grid-template-columns: 1fr;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background-color: #121212;
        }
        #paramsHolder {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, max-content) 58px 26px);
            gap: 6px 8px;
            padding: 8px 12px;
            background-color: #222222;
            color: #d4d4d4;
            font-family: sans-serif;
            font-size: 12px;
            align-items: center;
            grid-row: 1;
            border-bottom: 1px solid #383838;
        }
        #paramsHolder label {
            text-align: right;
            white-space: nowrap;
            padding-left: 6px;
        }
        #paramsHolder input {
            width: 100%;
            padding: 3px 5px;
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #525252;
            border-radius: 4px;
            font-size: 12px;
        }
        #paramsHolder input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .opt-btn {
            background: #2f2f2f;
            color: #fbbf24;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            padding: 2px 0;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
        }
        .opt-btn:hover {
            background: #404040;
            border-color: #fbbf24;
        }
        .cvsWrapper {
            grid-row: 2;
            min-height: 0;
            min-width: 0;
            position: relative;
        }
        #cvsDisplay {
            display: block;
            background-color: #0d0d0f;
            width: 100%;
            height: 100%;
        }
        #systemSummaryHolder {
            grid-row: 3;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
            padding: 6px 14px;
            background-color: #1b1e23;
            border-top: 1px solid #333;
            color: #e5e5e5;
            font-family: monospace;
            font-size: 12px;
        }
        #resultsHolder {
            grid-row: 4;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 14px;
            background: #222222;
            border-top: 1px solid #383838;
            font-family: monospace;
            font-size: 12px;
            color: #e5e5e5;
        }
    </style>
</head>
<body>
    <div id="mainHolder">
        <div id="paramsHolder"></div>
        <div class="cvsWrapper">
            <canvas id="cvsDisplay"></canvas>
        </div>
        <div id="systemSummaryHolder"></div>
        <div id="resultsHolder"></div>
    </div>

    <script>
        const paramsHolder = document.getElementById('paramsHolder');
        const cvsDisplay = document.getElementById('cvsDisplay');
        const systemSummaryHolder = document.getElementById('systemSummaryHolder');
        const resultsHolder = document.getElementById('resultsHolder');
        const cvsWrapper = document.querySelector('.cvsWrapper');
        const ctx = cvsDisplay.getContext('2d');

        const params = {
            tubeWidth: { value: 120.0, label: 'Длина трубки (мм)', step: 1, min: 20, isInt: false },
            coilsCount: { value: 5, label: 'Кол-во катушек', step: 1, min: 1, isInt: true },
            coilWidth: { value: 18, label: 'Ширина катушки (мм)', step: 0.5, min: 2, isInt: false },
            coilStep: { value: 4, label: 'Шаг катушек (мм)', step: 0.5, min: 0, isInt: false },
            spacerWidth: { value: 17.5, label: 'Прокладка (мм)', step: 0.5, min: 0, isInt: false },
            anchorsWidth: { value: 20.0, label: 'Длина якоря (мм)', step: 0.5, min: 2, isInt: false },
            coilOffset: { value: 10, label: 'Отступ катушек (мм)', step: 0.5, min: 0, isInt: false },
            anchorsCount: { value: 2, label: 'Кол-во якорей', step: 1, min: 1, isInt: true },

            tubeOutHeight:  { value: 6.0,   label: 'Внеш. D трубки (мм)',  step: 0.1,  min: 2,    isInt: false },
            tubeInHeight:   { value: 5.2,   label: 'Внутр. D трубки (мм)', step: 0.1,  min: 1.5,  isInt: false },
            coilWireSize:   { value: 0.18,  label: 'Диаметр провода (мм)', step: 0.01, min: 0.05, isInt: false },
            coilWireLayers: { value: 4,     label: 'Слоев намотки',       step: 1,    min: 1,    isInt: true  },
            maxOuterRadius: { value: 4.0,   label: 'Макс. наружный радиус (мм)', step: 0.1, min: 3.0, isInt: false },
            
            anchorsHeight:  { value: 5.0,   label: 'Диаметр якоря (мм)',   step: 0.1,  min: 1,    isInt: false },
            
            anchorsOffset:  { value: 0,     label: 'Нач. отступ якоря (мм)',step: 0.5, min: 0,    isInt: false },
            anchorsStep:    { value: 0,     label: 'Нач. зазор якорей (мм)',step: 0.5, min: 0,    isInt: false },
            voltage:        { value: 12.0,  label: 'Напряжение (В)',       step: 0.5,  min: 1,    isInt: false },
            maxCoilCurrent: { value: 3.3,   label: 'Макс. ток катушки (А)', step: 0.1,  min: 0.1,  max: 10, isInt: false },
            satTesla:       { value: 1.4,   label: 'Насыщение стали (Тл)', step: 0.1,  min: 0.2,  isInt: false },
            pwmFreqKhz:     { value: 22,    label: 'Частота ШИМ (кГц)',    step: 1,    min: 1,    max: 50, isInt: true },
            powerStep:      { value: 10,    label: 'Шаг ШИМ (%)',          step: 1,    min: 1,    max: 50, isInt: true },
            captureZone:    { value: 3.0,   label: 'Зона захвата (мм)',    step: 0.5,  min: 0,    isInt: false },
            minStrokePct:   { value: 40,    label: 'Мин. ход системы (%)', step: 1,    min: 0,    max: 95, isInt: true }
        };

        let Coils = [];
        let Anchors = [];
        let phasesData = {};
        let emSpecs = {};
        let systemSummary = {};

        let showForceChart = true;
        let showCurrentChart = true;

        const infoPanel = document.createElement('div');
        const sliderRow = document.createElement('div');
        const btnPrev = document.createElement('button');
        const sldProgress = document.createElement('input');
        const btnNext = document.createElement('button');
        const btnForceGraph = document.createElement('button');
        const btnCurrentGraph = document.createElement('button');

        sldProgress.type = 'range';
        sldProgress.min = 0;
        sldProgress.step = 1;
        sldProgress.value = 0;

        function calculateEMSpecs() {
            const wireD = params.coilWireSize.value;
            const coilW = params.coilWidth.value;
            const layers = params.coilWireLayers.value;
            const tubeOutD = params.tubeOutHeight.value;
            const anchorD = params.anchorsHeight.value;
            const U = params.voltage.value;
            const freqHz = params.pwmFreqKhz.value * 1000;
            const maxCurrentA = params.maxCoilCurrent.value;

            // Геометрическая оценка укладки: витки в слое по ширине, слои по радиусу.
            const turnsPerLayer = Math.max(1, Math.floor(coilW / wireD));
            const totalTurns = Math.max(1, turnsPerLayer * layers);
            const windingThickness = wireD * layers;
            const meanCoilD = tubeOutD + windingThickness;
            let wireLengthM = 0;
            for (let layer = 0; layer < layers; layer++) {
                const layerD = tubeOutD + wireD * (layer + 0.5);
                wireLengthM += Math.PI * layerD * turnsPerLayer / 1000;
            }
            const wireAreaMm2 = Math.PI * Math.pow(wireD / 2, 2);
            const resistanceOhm20 = Math.max(0.05, (0.0175 * wireLengthM) / wireAreaMm2);
            // Copper temperature coefficient: model coil at 80°C as a nominal hot condition.
            const resistanceOhm = resistanceOhm20 * (1 + 0.00393 * (80 - 20));
            const unconstrainedCurrentA = U / resistanceOhm;
            const operatingCurrentA = Math.min(maxCurrentA, unconstrainedCurrentA);
            const maxAmpTurns = operatingCurrentA * totalTurns;

            const anchorRadiusM = (anchorD / 2) / 1000;
            const anchorAreaM2 = Math.PI * anchorRadiusM * anchorRadiusM;
            const mu0 = 4 * Math.PI * 1e-7;
            const coilAreaM2 = anchorAreaM2;
            const coilLenM = Math.max(0.001, coilW / 1000);
            // Air-core solenoid estimate; core enhancement is handled by the position model below.
            const inductanceAirH = (mu0 * totalTurns * totalTurns * coilAreaM2) / coilLenM;
            const maxRippleA = (U * 0.25) / (Math.max(1e-6, inductanceAirH) * freqHz);
            const radialGapMm = Math.max(0.05, (params.tubeInHeight.value - anchorD) / 2);

            emSpecs = {
                totalTurns, turnsPerLayer, wireLengthM, resistanceOhm20, resistanceOhm,
                maxCurrentA: operatingCurrentA, unconstrainedCurrentA, maxAmpTurns,
                anchorAreaM2, mu0, inductanceMh: inductanceAirH * 1000,
                maxRippleA, radialGapMm, coilLenM, maxDuty: Math.min(1, maxCurrentA / Math.max(0.001, U / resistanceOhm))
            };
        }

        // Position-dependent inductance model. It is a first-order magnetic-circuit
        // approximation, not a FEM solution: overlap is softened by fringing and core
        // enhancement is limited by the configured steel saturation.
        function coilInductanceAt(coil, anchorOffset, anchorWidth, currentA) {
            const coilStart = coil.Offset;
            const coilEnd = coil.Offset + coil.Width;
            const anchorStart = anchorOffset;
            const anchorEnd = anchorOffset + anchorWidth;
            const overlap = Math.max(0, Math.min(coilEnd, anchorEnd) - Math.max(coilStart, anchorStart));
            const overlapRatio = Math.min(1, overlap / Math.max(0.001, coil.Width));
            const fringe = Math.max(0.25, params.captureZone.value || 0.5);
            const smoothOverlap = Math.min(1, overlapRatio + (fringe / Math.max(coil.Width, anchorWidth)) * 0.15);
            const Lair = emSpecs.inductanceMh / 1000;
            const gapM = Math.max(0.00005, emSpecs.radialGapMm / 1000);
            const steelPathM = Math.max(0.001, anchorWidth / 1000);
            const reluctanceAir = gapM / (emSpecs.mu0 * emSpecs.anchorAreaM2);
            const reluctanceCore = steelPathM / (emSpecs.mu0 * 800 * emSpecs.anchorAreaM2);
            const LcoreLinear = (emSpecs.totalTurns ** 2) / Math.max(1, reluctanceAir + reluctanceCore);
            const saturationCurrent = Math.max(0.1, params.satTesla.value * emSpecs.anchorAreaM2 * (reluctanceAir + reluctanceCore) / emSpecs.totalTurns);
            const saturationFactor = Math.tanh(Math.max(0, currentA) / saturationCurrent);
            const Lboost = Math.max(0, LcoreLinear - Lair) * saturationFactor;
            return Lair + Lboost * smoothOverlap;
        }

        // Force from magnetic co-energy: F ~= 0.5 * I² * dL/dx.
        // Position derivative is evaluated numerically; the sign follows the inductance gradient.
        function calcClusterForceNewtons(clusterOffset, clusterWidth, coilPowers) {
            const Imax = emSpecs.maxCurrentA;
            const U = params.voltage.value;
            let totalForceN = 0;
            const dxM = 0.05; // 0.05 mm finite-difference interval
            for (let c = 0; c < Coils.length; c++) {
                const duty = Math.max(0, Math.min(1, coilPowers[c] ?? 0));
                if (duty <= 0) continue;
                const currentA = Math.min(Imax, duty * U / emSpecs.resistanceOhm);
                const xPlus = clusterOffset + dxM;
                const xMinus = clusterOffset - dxM;
                const Lplus = coilInductanceAt(Coils[c], xPlus, clusterWidth, currentA);
                const Lminus = coilInductanceAt(Coils[c], xMinus, clusterWidth, currentA);
                const dLdx = (Lplus - Lminus) / (2 * dxM / 1000);
                totalForceN += 0.5 * currentA * currentA * dLdx;
            }
            return totalForceN;
        }

        function isClusterEnteringCoil(coil, clusterOffset, clusterWidth) {
            const frontTip = clusterOffset + clusterWidth;
            const backTip = clusterOffset;
            const cStart = coil.Offset;
            const cEnd = coil.Offset + coil.Width;
            const capture = params.captureZone.value;

            // Катушка полезна, пока передний торец входит в неё или движется к выходу,
            // а задний торец ещё не зашёл глубоко в зону торможения этой катушки
            return (frontTip >= cStart - capture) && (frontTip <= cEnd + coil.Width * 0.25) && (backTip < cStart);
        }

        function recalculatePhase(phaseKey) {
            const phase = phasesData[phaseKey];
            if (!phase) return;

            // Группируем только если прокладка === 0 и сердечники реально сомкнулись металл-к-металлу
            const mergedGroups = [];
            const EPSILON = 0.001;
            const hasSpacer = params.spacerWidth.value > 0.001;

            for (let i = 0; i < phase.anchors.length; i++) {
                const curr = phase.anchors[i];
                if (mergedGroups.length === 0) {
                    mergedGroups.push({ ids: [curr.id], offset: curr.offset, width: curr.width, height: curr.height, forceN: 0 });
                } else {
                    const last = mergedGroups[mergedGroups.length - 1];
                    if (!hasSpacer && Math.abs((last.offset + last.width) - curr.offset) <= EPSILON) {
                        last.ids.push(curr.id);
                        last.width += curr.width;
                    } else {
                        mergedGroups.push({ ids: [curr.id], offset: curr.offset, width: curr.width, height: curr.height, forceN: 0 });
                    }
                }
            }

            let totalForceN = 0;
            mergedGroups.forEach(group => {
                const fN = calcClusterForceNewtons(group.offset, group.width, phase.coilPowers);
                group.forceN = Number(fN.toFixed(3));
                totalForceN += group.forceN;
            });

            let supplyCurrentA = 0;
            let coilsCurrentA = 0;
            let copperPowerW = 0;
            for (let c = 0; c < Coils.length; c++) {
                const duty = Math.max(0, Math.min(1, phase.coilPowers[c] ?? 0));
                const currentA = Math.min(emSpecs.maxCurrentA, duty * params.voltage.value / emSpecs.resistanceOhm);
                // Approximate PWM average input current and RMS coil heating, assuming
                // current ripple is modest. A detailed switching simulation is not yet included.
                coilsCurrentA += currentA;
                supplyCurrentA += duty * currentA;
                copperPowerW += duty * currentA * currentA * emSpecs.resistanceOhm;
            }

            phase.mergedAnchors = mergedGroups;
            phase.totalForceN = Number(totalForceN.toFixed(3));
            phase.supplyCurrentA = Number(supplyCurrentA.toFixed(3));
            phase.coilsCurrentA = Number(coilsCurrentA.toFixed(3));
            phase.powerWatts = Number((supplyCurrentA * params.voltage.value).toFixed(2));
            phase.coilCopperLossW = Number(copperPowerW.toFixed(2));
        }

        function optimizeAllPhases() {
            const stepPct = Math.max(1, params.powerStep.value);
            const stepFrac = stepPct / 100;
            const maxStep = parseInt(sldProgress.max, 10);

            for (const key in phasesData) {
                const phaseKey = parseInt(key, 10);
                const phase = phasesData[phaseKey];
                if (!phase) continue;

                const isHoldPhase = (phaseKey === maxStep);
                phase.isHoldPhase = isHoldPhase;

                for (let c = 0; c < Coils.length; c++) {
                    const coil = Coils[c];
                    const cEnd = coil.Offset + coil.Width;
                    let bestDuty = 0;

                    phase.mergedAnchors.forEach(group => {
                        const frontTip = group.offset + group.width;
                        const backTip = group.offset;

                        if (isHoldPhase) {
                            // Режим удержания на финальной фазе против внешней силы влево
                            if (frontTip >= coil.Offset - params.captureZone.value && frontTip <= cEnd + coil.Width * 0.3 && backTip < coil.Offset) {
                                bestDuty = emSpecs.maxDuty;
                            }
                        } else if (isClusterEnteringCoil(coil, group.offset, group.width)) {
                            // Плавная передача при подходе переднего торца к выходу из катушки
                            const distToExit = cEnd - frontTip;
                            const handoverZone = coil.Width * 0.35;
                            let rawDuty = 1.0;
                            if (distToExit < handoverZone) {
                                rawDuty = Math.max(0.2, (distToExit + coil.Width * 0.25) / (handoverZone + coil.Width * 0.25));
                            }
                            const quantized = Math.round(rawDuty / stepFrac) * stepFrac;
                            if (quantized > bestDuty) {
                                bestDuty = Math.min(emSpecs.maxDuty, Number(quantized.toFixed(2)));
                            }
                        }
                    });

                    phase.coilPowers[c] = bestDuty;
                }

                recalculatePhase(phaseKey);

                // Координатная доводка: максимизируем тягу вправо и убираем лишний ШИМ при насыщении
                for (let c = 0; c < Coils.length; c++) {
                    if (phase.coilPowers[c] === 0) continue;
                    let bestP = phase.coilPowers[c];
                    let bestF = phase.totalForceN;

                    for (let p = 0; p <= bestP + 0.0001; p += stepFrac) {
                        if (p > emSpecs.maxDuty + 0.0001) continue;
                        const testP = Number(p.toFixed(2));
                        phase.coilPowers[c] = testP;
                        recalculatePhase(phaseKey);

                        if (phase.totalForceN > bestF + 0.005 ||
                           (Math.abs(phase.totalForceN - bestF) <= 0.005 && testP < bestP)) {
                            bestF = phase.totalForceN;
                            bestP = testP;
                        }
                    }
                    phase.coilPowers[c] = bestP;
                    recalculatePhase(phaseKey);
                }
            }
        }

        // Approximate human muscle force-length model for volume-matched comparison.
        // Volume: external coil diameter × full tube length. PCSA = volume / fiber length.
        const HUMAN_SPECIFIC_TENSION_MPA = 0.25;
        const HUMAN_INITIAL_FORCE_RATIO = 0.707;
        const HUMAN_OPTIMAL_LENGTH_RATIO = 0.85;
        function humanMuscleForceAtPhase(phaseKey) {
            const fiberLengthMm = params.tubeWidth.value;
            const coilOuterDiameterMm = params.tubeOutHeight.value + 2 * params.coilWireSize.value * params.coilWireLayers.value;
            const volumeMm3 = Math.PI * Math.pow(coilOuterDiameterMm / 2, 2) * params.tubeWidth.value;
            const pcsaMm2 = volumeMm3 / fiberLengthMm;
            const maxForceN = HUMAN_SPECIFIC_TENSION_MPA * pcsaMm2; // 1 MPa = 1 N/mm²
            const optimalLengthMm = fiberLengthMm * HUMAN_OPTIMAL_LENGTH_RATIO;
            const initialDeltaMm = fiberLengthMm - optimalLengthMm;
            const widthMm = initialDeltaMm / Math.sqrt(-Math.log(HUMAN_INITIAL_FORCE_RATIO));
            const currentLengthMm = Math.max(0.01, fiberLengthMm - phaseKey);
            const activeRatio = Math.exp(-Math.pow((currentLengthMm - optimalLengthMm) / widthMm, 2));
            return { forceN: maxForceN * activeRatio, maxForceN, activeRatio, currentLengthMm, volumeCm3: volumeMm3 / 1000, pcsaMm2 };
        }

        function computeSystemSummary() {
            const tubeLen = params.tubeWidth.value;
            const nAnchors = params.anchorsCount.value;
            const anchorLen = params.anchorsWidth.value;
            const spacer = params.spacerWidth.value;

            const totalAssemblyLen = nAnchors * anchorLen + Math.max(0, nAnchors - 1) * spacer;
            const strokeMm = Math.max(0, tubeLen - totalAssemblyLen);
            const strokePct = tubeLen > 0 ? (strokeMm / tubeLen) * 100 : 0;

            const keys = Object.keys(phasesData).map(Number).sort((a, b) => a - b);
            const maxKey = keys.length > 0 ? keys[keys.length - 1] : 0;
            const moveKeys = keys.length > 1 ? keys.slice(0, -1) : keys;

            let sumForce = 0;
            let peakForce = -Infinity;
            moveKeys.forEach(k => {
                const f = phasesData[k].totalForceN;
                sumForce += f;
                if (f > peakForce) peakForce = f;
            });
            const avgForceN = moveKeys.length > 0 ? sumForce / moveKeys.length : 0;
            const holdForceN = phasesData[maxKey] ? phasesData[maxKey].totalForceN : 0;

            let sumCurrent = 0;
            let sumWatts = 0;
            keys.forEach(k => {
                sumCurrent += phasesData[k].supplyCurrentA;
                sumWatts += phasesData[k].powerWatts;
            });
            const avgCurrentA = keys.length > 0 ? sumCurrent / keys.length : 0;
            const avgWatts = keys.length > 0 ? sumWatts / keys.length : 0;
            const efficiencyNPerW = avgWatts > 0 ? avgForceN / avgWatts : 0;
            const humanMove = moveKeys.map(k => humanMuscleForceAtPhase(k));
            const avgHumanForceN = humanMove.length ? humanMove.reduce((a, v) => a + v.forceN, 0) / humanMove.length : 0;
            const avgHumanMatchPct = moveKeys.length ? moveKeys.reduce((a, k) => { const hf = humanMuscleForceAtPhase(k).forceN; return a + (hf > 0 ? phasesData[k].totalForceN / hf * 100 : 0); }, 0) / moveKeys.length : 0;

            systemSummary = {
                strokeMm,
                strokePct,
                avgForceN,
                peakForceN: peakForce === -Infinity ? 0 : peakForce,
                holdForceN,
                avgCurrentA,
                avgWatts,
                efficiencyNPerW,
                avgHumanForceN,
                avgHumanMatchPct
            };

            const isStrokeOk = strokePct >= params.minStrokePct.value - 0.01;
            const strokeColor = isStrokeOk ? '#4ade80' : '#f87171';
            const strokeWarn = isStrokeOk ? '' : ` [⚠ < ${params.minStrokePct.value}%]`;

            systemSummaryHolder.innerHTML = `
                <span style="color:#94a3b8; font-weight:bold;">СВОДКА ПО ВСЕМ ФАЗАМ:</span>
                <span>Рабочий ход: <b style="color:${strokeColor}">${strokePct.toFixed(1)}% (${strokeMm.toFixed(1)} мм)${strokeWarn}</b></span>
                <span>Средняя тяга: <b style="color:#38bdf8">${avgForceN.toFixed(2)} Н</b> (пик: ${systemSummary.peakForceN.toFixed(2)} Н)</span>
                <span>Средняя сила мышцы: <b>${avgHumanForceN.toFixed(2)} Н</b> | ЭМВ: <b>${avgHumanMatchPct.toFixed(1)}%</b> от силы мышцы</span>
                <span>Удержание (финал): <b style="color:#a78bfa">${holdForceN.toFixed(2)} Н</b></span>
                <span>Средний ток БП: <b style="color:#fbbf24">${avgCurrentA.toFixed(2)} А</b> (${avgWatts.toFixed(1)} Вт)</span>
                <span>Эффективность: <b>${efficiencyNPerW.toFixed(3)} Н/Вт</b></span>
            `;
        }

        function buildAllPhases() {
            phasesData = {};
            const maxStep = parseInt(sldProgress.max, 10);
            const spacer = params.spacerWidth.value;

            for (let step = 0; step <= maxStep; step++) {
                let moveLim = params.tubeWidth.value;
                const phaseAnchors = new Array(Anchors.length);

                for (let i = Anchors.length - 1; i >= 0; --i) {
                    moveLim -= Anchors[i].Width;
                    let pos = Anchors[i].StartOffset + step;
                    if (pos > moveLim) pos = moveLim;

                    phaseAnchors[i] = {
                        id: Anchors[i].Id,
                        offset: pos,
                        width: Anchors[i].Width,
                        height: Anchors[i].Height
                    };

                    // Следующий (левый) якорь упирается в прокладку перед текущим
                    moveLim = pos - spacer;
                }

                phasesData[step] = {
                    offset: step,
                    coilPowers: new Array(Coils.length).fill(0),
                    anchors: phaseAnchors,
                    mergedAnchors: [],
                    totalForceN: 0,
                    supplyCurrentA: 0,
                    coilsCurrentA: 0,
                    powerWatts: 0,
                    isHoldPhase: false
                };
                recalculatePhase(step);
            }

            optimizeAllPhases();
            computeSystemSummary();
        }

        function isValidConfig() {
            if (params.tubeInHeight.value >= params.tubeOutHeight.value) return false;
            if (params.anchorsHeight.value >= params.tubeInHeight.value) return false;

            // Limit the winding's outer radius; wire diameter remains a fixed user parameter.
            const windingOuterRadius = params.tubeOutHeight.value / 2
                + params.coilWireSize.value * params.coilWireLayers.value;
            if (windingOuterRadius > params.maxOuterRadius.value + 1e-9) return false;

            const tubeLen = params.tubeWidth.value;
            const nAnchors = params.anchorsCount.value;
            const anchorLen = params.anchorsWidth.value;
            const spacer = params.spacerWidth.value;
            const initialGap = Math.max(spacer, params.anchorsStep.value);

            const minAssemblyLen = nAnchors * anchorLen + Math.max(0, nAnchors - 1) * spacer;
            const startAssemblyLen = params.anchorsOffset.value + nAnchors * anchorLen + Math.max(0, nAnchors - 1) * initialGap;
            if (startAssemblyLen > tubeLen) return false;

            const strokePct = ((tubeLen - minAssemblyLen) / tubeLen) * 100;
            if (strokePct < params.minStrokePct.value - 0.01) return false;

            return true;
        }

        function optimizeSingleParam(targetKey) {
            const item = params[targetKey];
            const originalVal = item.value;
            const step = item.step;

            let bestVal = originalVal;
            let bestScore = -Infinity;

            for (let i = -100; i <= 100; i++) {
                let candidate = originalVal + i * step;
                if (item.isInt) candidate = Math.round(candidate);
                else candidate = Number(candidate.toFixed(4));

                if (item.min !== undefined && candidate < item.min) continue;
                if (item.max !== undefined && candidate > item.max) continue;

                item.value = candidate;
                if (!isValidConfig()) continue;

                resetParams();
                buildAllPhases();

                const score = systemSummary.avgForceN;
                if (score > bestScore + 0.001) {
                    bestScore = score;
                    bestVal = candidate;
                }
            }

            item.value = bestVal;
            const inp = document.getElementById('param_' + targetKey);
            if (inp) inp.value = bestVal;

            resetParams();
            buildAllPhases();
            applyPhase(parseInt(sldProgress.value, 10));
        }

        // Coordinate-search design helper. The specified geometry and operating
        // constraints are held fixed; only construction parameters are varied.
        async function autoCalculateAll() {
            const btn = document.getElementById('btnAutoCalculate');
            if (btn.disabled) return;
            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = 'Расчёт...';

            const fixedKeys = new Set([
                'tubeWidth', 'tubeOutHeight', 'tubeInHeight', 'anchorsHeight',
                'voltage', 'maxCoilCurrent', 'minStrokePct', 'captureZone', 'coilWireSize', 'maxOuterRadius',
                'satTesla', 'pwmFreqKhz', 'powerStep'
            ]);
            const search = [
                ['coilsCount', 1, 1], ['coilWidth', 2, 2],
                ['coilWireLayers', 1, 1],
                ['coilStep', 1, 1], ['coilOffset', 1, 1],
                ['anchorsCount', 1, 1], ['anchorsWidth', 2, 2],
                ['anchorsOffset', 1, 1], ['anchorsStep', 0.5, 1],
                ['spacerWidth', 0.5, 1]
            ].filter(x => !fixedKeys.has(x[0]));

            const original = {};
            for (const key in params) original[key] = params[key].value;
            const sliderOriginal = Number(sldProgress.value) || 0;
            let bestValues = {...original};
            let bestScore = -Infinity;

            function applyValues(values) {
                for (const key in values) params[key].value = values[key];
                resetParams();
                if (!isValidConfig()) return null;
                buildAllPhases();
                if (systemSummary.strokePct < params.minStrokePct.value - 0.01) return null;
                // Primary objective: mean useful thrust. Efficiency breaks near-ties.
                return systemSummary.avgForceN + Math.min(0.0009, systemSummary.efficiencyNPerW * 0.00001);
            }

            try {
                // Coarse coordinate descent, two passes. It is a heuristic search,
                // not a proof of global optimum or a thermal/electrical safety check.
                for (let pass = 0; pass < 2; pass++) {
                    for (const [key, delta, radius] of search) {
                        const item = params[key];
                        const center = bestValues[key];
                        let localBest = center;
                        let localScore = applyValues(bestValues);
                        if (localScore === null) localScore = -Infinity;
                        const candidates = [];
                        for (let n = -radius; n <= radius; n++) {
                            let v = center + n * delta;
                            if (item.isInt) v = Math.round(v);
                            else v = Number(v.toFixed(4));
                            if (item.min !== undefined) v = Math.max(item.min, v);
                            if (item.max !== undefined) v = Math.min(item.max, v);
                            if (!candidates.includes(v)) candidates.push(v);
                        }
                        for (const candidate of candidates) {
                            const test = {...bestValues, [key]: candidate};
                            const score = applyValues(test);
                            if (score !== null && score > localScore + 1e-9) {
                                localScore = score;
                                localBest = candidate;
                            }
                        }
                        bestValues[key] = localBest;
                        btn.textContent = `Расчёт ${key} (${pass + 1}/2)`;
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }
                applyValues(bestValues);
                for (const key in params) {
                    const input = document.getElementById('param_' + key);
                    if (input) input.value = params[key].value;
                }
                sldProgress.value = Math.min(sliderOriginal, Number(sldProgress.max) || 0);
                applyPhase(parseInt(sldProgress.value, 10));
                btn.textContent = 'Авторасчёт завершён';
            } catch (err) {
                for (const key in original) params[key].value = original[key];
                resetParams();
                buildAllPhases();
                applyPhase(Math.min(sliderOriginal, Number(sldProgress.max) || 0));
                btn.textContent = 'Ошибка расчёта';
                console.error('Auto calculation failed:', err);
            } finally {
                btn.disabled = false;
                setTimeout(() => { btn.textContent = oldText; }, 2500);
            }
        }

        function buildForm() {
            paramsHolder.innerHTML = '';
            for (const key in params) {
                const item = params[key];
                const label = document.createElement('label');
                label.textContent = item.label + ':';
                label.htmlFor = 'param_' + key;

                const input = document.createElement('input');
                input.type = 'number';
                input.id = 'param_' + key;
                input.value = item.value;
                input.step = item.step;
                if (item.min !== undefined) input.min = item.min;
                if (item.max !== undefined) input.max = item.max;

                input.addEventListener('input', function () {
                    const parsed = item.isInt ? parseInt(this.value, 10) : parseFloat(this.value);
                    if (!isNaN(parsed)) {
                        params[key].value = parsed;
                        resetParams();
                        buildAllPhases();
                        applyPhase(parseInt(sldProgress.value, 10));
                    }
                });

                const optBtn = document.createElement('button');
                optBtn.type = 'button';
                optBtn.className = 'opt-btn';
                optBtn.textContent = '✨';
                optBtn.title = `Автоподбор "${item.label}" (-100..+100 шагов) для макс. тяги при ходе ≥ ${params.minStrokePct.value}%`;
                optBtn.addEventListener('click', () => optimizeSingleParam(key));

                paramsHolder.appendChild(label);
                paramsHolder.appendChild(input);
                paramsHolder.appendChild(optBtn);
            }
            const autoBtn = document.createElement('button');
            autoBtn.type = 'button';
            autoBtn.id = 'btnAutoCalculate';
            autoBtn.textContent = 'Авторасчёт конструкции';
            autoBtn.title = 'Подбор конструкции при фиксированных диаметрах, диаметре провода и ограничении наружного радиуса';
            autoBtn.style.cssText = 'grid-column:1/-1; background:#164e63; color:#e0f2fe; border:1px solid #0e7490; border-radius:5px; padding:7px 12px; cursor:pointer; font-weight:bold;';
            autoBtn.addEventListener('click', autoCalculateAll);
            paramsHolder.appendChild(autoBtn);
        }

        function init() {
            infoPanel.style.cssText = 'display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;';
            sliderRow.style.cssText = 'display: flex; align-items: center; gap: 8px; width: 100%;';
            sldProgress.style.cssText = 'flex: 1; cursor: pointer;';

            const btnStyle = 'background: #383838; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-family: monospace; font-size: 12px;';
            btnPrev.textContent = '◀';
            btnNext.textContent = '▶';
            btnForceGraph.textContent = '📈 График тяги (Н)';
            btnCurrentGraph.textContent = '⚡ График тока (А)';

            btnPrev.style.cssText = btnStyle;
            btnNext.style.cssText = btnStyle;
            btnForceGraph.style.cssText = btnStyle + 'border-color: #38bdf8; color: #38bdf8;';
            btnCurrentGraph.style.cssText = btnStyle + 'border-color: #fbbf24; color: #fbbf24;';

            btnPrev.addEventListener('click', () => {
                sldProgress.value = Math.max(0, parseInt(sldProgress.value, 10) - 1);
                applyPhase(parseInt(sldProgress.value, 10));
            });
            btnNext.addEventListener('click', () => {
                sldProgress.value = Math.min(parseInt(sldProgress.max, 10), parseInt(sldProgress.value, 10) + 1);
                applyPhase(parseInt(sldProgress.value, 10));
            });

            btnForceGraph.addEventListener('click', () => {
                showForceChart = !showForceChart;
                btnForceGraph.style.borderColor = showForceChart ? '#38bdf8' : '#555';
                btnForceGraph.style.color = showForceChart ? '#38bdf8' : '#aaa';
                draw(parseInt(sldProgress.value, 10));
            });

            btnCurrentGraph.addEventListener('click', () => {
                showCurrentChart = !showCurrentChart;
                btnCurrentGraph.style.borderColor = showCurrentChart ? '#fbbf24' : '#555';
                btnCurrentGraph.style.color = showCurrentChart ? '#fbbf24' : '#aaa';
                draw(parseInt(sldProgress.value, 10));
            });

            sliderRow.appendChild(btnPrev);
            sliderRow.appendChild(sldProgress);
            sliderRow.appendChild(btnNext);
            sliderRow.appendChild(btnForceGraph);
            sliderRow.appendChild(btnCurrentGraph);

            resultsHolder.appendChild(infoPanel);
            resultsHolder.appendChild(sliderRow);

            new ResizeObserver(entries => {
                const { width, height } = entries[0].contentRect;
                const dpr = window.devicePixelRatio || 1;
                cvsDisplay.width = Math.floor(width * dpr);
                cvsDisplay.height = Math.floor(height * dpr);
                draw(parseInt(sldProgress.value, 10));
            }).observe(cvsWrapper);
        }

        function resetParams() {
            calculateEMSpecs();
            Coils = [];
            Anchors = [];

            const nAnchors = params.anchorsCount.value;
            const anchorLen = params.anchorsWidth.value;
            const spacer = params.spacerWidth.value;
            const initialGap = Math.max(spacer, params.anchorsStep.value);

            const minAssemblyLen = nAnchors * anchorLen + Math.max(0, nAnchors - 1) * spacer;
            const maxOffset = params.tubeWidth.value - minAssemblyLen - params.anchorsOffset.value;

            sldProgress.max = Math.max(0, Math.floor(maxOffset));
            if (parseInt(sldProgress.value, 10) > sldProgress.max) {
                sldProgress.value = sldProgress.max;
            }

            const coilH = params.tubeOutHeight.value + params.coilWireSize.value * params.coilWireLayers.value * 2;
            let offset = params.coilOffset.value;
            for (let i = 0; i < params.coilsCount.value; ++i) {
                Coils.push({ Id: i + 1, Height: coilH, Width: params.coilWidth.value, Offset: offset });
                offset += params.coilWidth.value + params.coilStep.value;
            }

            offset = params.anchorsOffset.value;
            for (let i = 0; i < nAnchors; ++i) {
                Anchors.push({ Id: i + 1, Height: params.anchorsHeight.value, Width: anchorLen, Offset: offset, StartOffset: offset });
                offset += anchorLen + initialGap;
            }
        }

        function applyPhase(phaseKey) {
            const phase = phasesData[phaseKey];
            if (!phase) return;

            for (let i = 0; i < Anchors.length; i++) {
                Anchors[i].Offset = phase.anchors[i].offset;
            }

            const anchorsText = phase.mergedAnchors.map(g => {
                const sign = g.forceN > 0 ? '+' : '';
                const name = g.ids.length > 1 ? `Сборка #${g.ids.join('+')}` : `Якорь #${g.ids}`;
                return `${name}: <b>${sign}${g.forceN.toFixed(2)} Н</b>`;
            }).join(' | ');

            const modeBadge = phase.isHoldPhase
                ? '<span style="background:#4c1d95; color:#ddd6fe; padding:1px 6px; border-radius:4px; font-weight:bold;">🔒 УДЕРЖАНИЕ</span>'
                : '';

            const pwmText = phase.coilPowers.map((p, idx) => `К${idx + 1}:${Math.round(p * 100)}%`).join(' ');
            const human = humanMuscleForceAtPhase(Number(phaseKey));
            const matchPct = human.forceN > 0 ? phase.totalForceN / human.forceN * 100 : 0;

            infoPanel.innerHTML = `
                <div>Фаза: <b>${phaseKey}/${sldProgress.max}</b> ${modeBadge} &nbsp;|&nbsp; ${anchorsText} &nbsp;|&nbsp; Тяга: <b style="color:#4ade80">${phase.totalForceN > 0 ? '+' : ''}${phase.totalForceN.toFixed(2)} Н</b></div>
                <div>Мышца аналогичного объёма: <b>${human.forceN.toFixed(2)} Н</b> (${(human.activeRatio * 100).toFixed(1)}% от максимума) | ЭМВ: <b>${matchPct.toFixed(1)}%</b> силы мышцы</div>
                <div>Ток БП: <b style="color:#fbbf24">${phase.supplyCurrentA.toFixed(2)} А</b> (${phase.powerWatts.toFixed(1)} Вт) &nbsp;|&nbsp; Ток обмоток: <b style="color:#38bdf8">${phase.coilsCurrentA.toFixed(2)} А</b> &nbsp;|&nbsp; [${pwmText}]</div>
            `;

            draw(phaseKey);
        }

        function drawRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawTextWithBg(text, x, y, textColor, bgColor = 'rgba(38, 38, 38, 0.9)', paddingX = 6, paddingY = 3) {
            ctx.save();
            ctx.font = 'bold 11px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const textWidth = ctx.measureText(text).width;
            const boxWidth = textWidth + paddingX * 2;
            const boxHeight = 13 + paddingY * 2;

            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(x - boxWidth / 2, y - boxHeight / 2, boxWidth, boxHeight, 4);
            ctx.fill();

            ctx.fillStyle = textColor;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function drawChartPanel(box, phaseKey, config) {
            const keys = Object.keys(phasesData).map(Number).sort((a, b) => a - b);
            if (keys.length < 2) return;

            ctx.fillStyle = 'rgba(20, 20, 24, 0.95)';
            ctx.fillRect(box.x, box.y, box.w, box.h);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.strokeRect(box.x, box.y, box.w, box.h);

            const padL = 52, padR = 16, padT = 22, padB = 20;
            const plotW = Math.max(10, box.w - padL - padR);
            const plotH = Math.max(10, box.h - padT - padB);

            let minY = 0;
            let maxY = 0.1;
            keys.forEach(k => {
                config.series.forEach(s => {
                    const v = s.getValue(phasesData[k]);
                    if (v < minY) minY = v;
                    if (v > maxY) maxY = v;
                });
            });
            maxY *= 1.1;
            if (minY < 0) minY *= 1.1;
            const spanY = Math.max(0.01, maxY - minY);

            const toX = k => box.x + padL + (k / Math.max(1, keys.length - 1)) * plotW;
            const toY = v => box.y + padT + plotH - ((v - minY) / spanY) * plotH;

            // Сетка Y: ровно 10 шагов
            const ySteps = 10;
            ctx.font = '10px monospace';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let s = 0; s <= ySteps; s++) {
                const val = minY + (spanY * s) / ySteps;
                const y = toY(val);

                ctx.strokeStyle = Math.abs(val) < 1e-6 ? '#555' : 'rgba(255, 255, 255, 0.08)';
                ctx.beginPath();
                ctx.moveTo(box.x + padL, y);
                ctx.lineTo(box.x + padL + plotW, y);
                ctx.stroke();

                if (s % 2 === 0 || s === ySteps) {
                    ctx.fillStyle = '#888';
                    ctx.fillText(val.toFixed(1) + config.unit, box.x + padL - 6, y);
                }
            }

            // Сетка X: каждая 5-я фаза
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            keys.forEach(k => {
                if (k % 5 === 0) {
                    const x = toX(k);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.beginPath();
                    ctx.moveTo(x, box.y + padT);
                    ctx.lineTo(x, box.y + padT + plotH);
                    ctx.stroke();

                    ctx.fillStyle = '#888';
                    ctx.fillText(k.toString(), x, box.y + padT + plotH + 4);
                }
            });

            const zeroY = toY(0);

            config.series.forEach(s => {
                ctx.beginPath();
                keys.forEach((k, idx) => {
                    const x = toX(k);
                    const y = toY(s.getValue(phasesData[k]));
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });

                if (s.dashed) ctx.setLineDash([4, 4]);
                else ctx.setLineDash([]);

                ctx.strokeStyle = s.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);

                if (s.fill) {
                    ctx.lineTo(toX(keys[keys.length - 1]), zeroY);
                    ctx.lineTo(toX(keys[0]), zeroY);
                    ctx.closePath();
                    ctx.fillStyle = s.fill;
                    ctx.fill();
                }
            });

            const curX = toX(phaseKey);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(curX, box.y + padT);
            ctx.lineTo(curX, box.y + padT + plotH);
            ctx.stroke();

            config.series.forEach(s => {
                const curVal = s.getValue(phasesData[phaseKey]);
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(curX, toY(curVal), 4, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = '#e5e5e5';
            ctx.font = 'bold 11px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(config.title, box.x + padL, box.y + 5);
        }

        function draw(phaseKey = 0) {
            const dpr = window.devicePixelRatio || 1;
            const W = cvsDisplay.width / dpr;
            const H = cvsDisplay.height / dpr;

            ctx.save();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, W, H);

            const activeCharts = (showForceChart ? 1 : 0) + (showCurrentChart ? 1 : 0);
            const tubeAreaH = activeCharts === 0 ? H : (activeCharts === 1 ? H * 0.56 : H * 0.42);
            const mmPx = W / params.tubeWidth.value;
            const phase = phasesData[phaseKey];

            // 1. Катушки + мощность (%) + ток обмотки (А)
            for (let i = 0; i < Coils.length; ++i) {
                const pwr = phase ? Math.abs(phase.coilPowers[i]) : 0;
                const cx = Coils[i].Offset * mmPx;
                const cw = Coils[i].Width * mmPx;
                const ch = mmPx * Coils[i].Height;
                const cy = (tubeAreaH - ch) / 2;

                ctx.globalAlpha = 0.22 + 0.78 * pwr;
                drawRect(cx, cy, cw, ch, '#EA3');
                ctx.globalAlpha = 1.0;

                const pct = Math.round(pwr * 100);
                const coilAmp = pwr * emSpecs.maxCurrentA;
                drawTextWithBg(`К${i + 1}: ${pct}%`, cx + cw / 2, cy + ch + 14, pct === 0 ? '#737373' : '#fbbf24', 'rgba(30, 30, 30, 0.88)');
                drawTextWithBg(`${coilAmp.toFixed(2)} А`, cx + cw / 2, cy + ch + 33, pct === 0 ? '#666666' : '#38bdf8', 'rgba(24, 24, 28, 0.88)');
            }

            // 2. Трубка
            drawRect(0, (tubeAreaH - mmPx * params.tubeOutHeight.value) / 2, W, mmPx * params.tubeOutHeight.value, '#CCC');
            drawRect(0, (tubeAreaH - mmPx * params.tubeInHeight.value) / 2, W, mmPx * params.tubeInHeight.value, '#888');

            // 3. Немагнитные прокладки (оранжевые вставки перед каждым якорем начиная со 2-го)
            const spacer = params.spacerWidth.value;
            if (spacer > 0 && phase) {
                const sh = mmPx * params.anchorsHeight.value;
                const sy = (tubeAreaH - sh) / 2;
                for (let i = 1; i < phase.anchors.length; i++) {
                    const a = phase.anchors[i];
                    const sx = (a.offset - spacer) * mmPx;
                    const sw = spacer * mmPx;
                    drawRect(sx, sy, sw, sh, '#f97316');
                }
            }

            // 4. Якоря и тяга в Ньютонах
            const groups = phase ? phase.mergedAnchors : [];
            for (let i = 0; i < groups.length; ++i) {
                const g = groups[i];
                const gx = g.offset * mmPx;
                const gw = g.width * mmPx;
                const gh = mmPx * g.height;
                const gy = (tubeAreaH - gh) / 2;

                drawRect(gx, gy, gw, gh, '#3ae');

                const f = g.forceN ?? 0;
                const textColor = f > 0.01 ? '#4ade80' : (f < -0.01 ? '#f87171' : '#e5e5e5');
                const prefix = g.ids.length > 1 ? `[${g.ids.join('+')}] ` : '';
                drawTextWithBg(`${prefix}${f > 0 ? '+' : ''}${f.toFixed(2)} Н`, gx + gw / 2, gy - 15, textColor);
            }

            // 5. Графики
            if (activeCharts > 0) {
                const chartsTop = tubeAreaH + 6;
                const chartsTotalH = H - chartsTop - 6;
                const singleChartH = (chartsTotalH - (activeCharts - 1) * 6) / activeCharts;
                let curTop = chartsTop;

                if (showForceChart) {
                    drawChartPanel({ x: 8, y: curTop, w: W - 16, h: singleChartH }, phaseKey, {
                        title: `СУММАРНАЯ ТЯГА СИСТЕМЫ (Средняя: ${systemSummary.avgForceN.toFixed(2)} Н | Удержание: ${systemSummary.holdForceN.toFixed(2)} Н)`,
                        unit: ' Н',
                        series: [
                            { getValue: p => p.totalForceN, color: '#38bdf8', fill: 'rgba(56, 189, 248, 0.15)' },
                            { getValue: p => humanMuscleForceAtPhase(Object.keys(phasesData).find(k => phasesData[k] === p) * 1).forceN, color: '#f97316', dashed: true }
                        ]
                    });
                    curTop += singleChartH + 6;
                }

                if (showCurrentChart) {
                    drawChartPanel({ x: 8, y: curTop, w: W - 16, h: singleChartH }, phaseKey, {
                        title: `ТОК ШИМ ${params.pwmFreqKhz.value} кГц — Желтый: от БП (ср. ${systemSummary.avgCurrentA.toFixed(2)} А) | Пунктир: в обмотках | Пульсации ΔI ≈ ${emSpecs.maxRippleA.toFixed(2)} А`,
                        unit: ' А',
                        series: [
                            { getValue: p => p.coilsCurrentA, color: '#38bdf8', dashed: true },
                            { getValue: p => p.supplyCurrentA, color: '#fbbf24', fill: 'rgba(251, 191, 36, 0.18)' }
                        ]
                    });
                }
            }

            ctx.restore();
        }

        sldProgress.addEventListener('input', function () {
            applyPhase(parseInt(this.value, 10));
        });

        buildForm();
        init();
        resetParams();
        buildAllPhases();
        applyPhase(0);
    </script>
</body>
