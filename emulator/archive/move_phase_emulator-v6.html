<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Move Phase Emulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        #mainHolder {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background-color: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #paramsHolder {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, max-content) 65px);
            gap: 6px 14px;
            padding: 10px 14px;
            background-color: #262626;
            color: #d4d4d4;
            font-size: 13px;
            align-items: center;
            grid-row: 1;
            grid-column: 1;
            border-bottom: 1px solid #404040;
        }
        #paramsHolder label {
            text-align: right;
            white-space: nowrap;
        }
        #paramsHolder input {
            width: 100%;
            padding: 3px 6px;
            background-color: #383838;
            color: #ffffff;
            border: 1px solid #525252;
            border-radius: 4px;
            font-size: 13px;
        }
        #paramsHolder input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .cvsWrapper {
            grid-row: 2;
            grid-column: 1;
            min-height: 0;
            min-width: 0;
            position: relative;
        }
        #cvsDisplay {
            display: block;
            background-color: #000000;
            width: 100%;
            height: 100%;
        }
        #resultsHolder {
            display: grid;
            grid-row: 3;
            grid-column: 1;
            grid-template-columns: 1fr;
            gap: 8px;
            padding: 10px 14px;
            background-color: #262626;
            border-top: 1px solid #404040;
            color: #e5e5e5;
        }
        .info-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 18px;
            font-family: monospace;
            font-size: 13px;
        }
        .info-stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 18px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-row input[type="range"] {
            flex: 1;
            cursor: pointer;
        }
        button {
            background-color: #383838;
            color: #f5f5f5;
            border: 1px solid #525252;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }
        button:hover {
            background-color: #4a4a4a;
        }
        button.active {
            background-color: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            font-weight: 600;
        }
        .badge-coils {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div id="mainHolder">
        <div id="paramsHolder"></div>
        <div class="cvsWrapper">
            <canvas id="cvsDisplay"></canvas>
        </div>
        <div id="resultsHolder"></div>
    </div>

    <script>
        const paramsHolder = document.getElementById('paramsHolder');
        const cvsDisplay = document.getElementById('cvsDisplay');
        const resultsHolder = document.getElementById('resultsHolder');
        const cvsWrapper = document.querySelector('.cvsWrapper');
        const ctx = cvsDisplay.getContext('2d');

        const sldProgress = document.createElement('input');
        const infoRow = document.createElement('div');
        const infoStats = document.createElement('div');
        const btnToggleChart = document.createElement('button');

        const params = {
            tubeWidth:      { value: 106.0, label: 'Длина трубки',      step: 1,    min: 10,   isInt: false },
            tubeOutHeight:  { value: 6.0,   label: 'Внеш. D трубки',    step: 0.1,  min: 1,    isInt: false },
            tubeInHeight:   { value: 5.2,   label: 'Внутр. D трубки',   step: 0.1,  min: 1,    isInt: false },
            coilsCount:     { value: 5,     label: 'Кол-во катушек',    step: 1,    min: 1,    isInt: true  },
            coilWidth:      { value: 17,    label: 'Ширина катушки',    step: 0.5,  min: 1,    isInt: false },
            coilWireSize:   { value: 0.18,  label: 'Диаметр провода',   step: 0.01, min: 0.01, isInt: false },
            coilWireLayers: { value: 4,     label: 'Слоев намотки',     step: 1,    min: 1,    isInt: true  },
            coilStep:       { value: 4,     label: 'Шаг катушек',       step: 0.5,  min: 0,    isInt: false },
            coilOffset:     { value: 2,     label: 'Отступ катушек',    step: 0.5,  min: 0,    isInt: false },
            anchorsHeight:  { value: 5,     label: 'Диаметр якоря',     step: 0.1,  min: 1,    isInt: false },
            anchorsCount:   { value: 3,     label: 'Кол-во якорей',     step: 1,    min: 1,    isInt: true  },
            anchorsOffset:  { value: 0,     label: 'Нач. отступ якоря', step: 0.5,  min: 0,    isInt: false },
            anchorsStep:    { value: 0.8,   label: 'Зазор меж якорями', step: 0.1,  min: 0,    isInt: false },
            anchorsWidth:   { value: 20.2,  label: 'Длина якоря',       step: 0.5,  min: 1,    isInt: false }
        };

        let Coils = [];
        let Anchors = [];
        let phasesData = {};
        let showForceChart = false;

        sldProgress.type = 'range';
        sldProgress.min = 0;
        sldProgress.step = 1;
        sldProgress.value = 0;

        // 1. Непериодическая кривая тяги одиночной катушки на железный сердечник:
        // строго сохраняет знак dx (dx > 0 -> тянет вправо, dx < 0 -> тянет влево)
        function calcSingleCoilForce(coil, targetOffset, targetWidth, coilPower) {
            if (!coilPower || coilPower === 0) return 0;

            const coilCenter = coil.Offset + coil.Width / 2;
            const targetCenter = targetOffset + targetWidth / 2;
            const dx = coilCenter - targetCenter;

            // Характерный масштаб спада поля (пик тяги приходится на край катушки)
            const sigma = ((coil.Width + targetWidth) / 2) * 0.65;
            if (sigma <= 0) return 0;

            const u = dx / sigma;
            // За пределами 4.5 сигм поле практически равно нулю
            if (Math.abs(u) > 4.5) return 0;

            // Производная гауссианы: 0 в центре, пик ±1.0 при u = ±1, монотонное затухание без смены знака
            const rawForce = u * Math.exp((1 - u * u) / 2);

            return rawForce * Math.abs(coilPower);
        }

        // 2. Индуцированная намагниченность сердечника в поле катушек (одинаковая полярность)
        function calcMagnetization(offset, width, phase) {
            let mag = 0;
            const aStart = offset;
            const aEnd = offset + width;

            for (let c = 0; c < Coils.length; c++) {
                const power = phase.coilPowers[c] ?? 0;
                if (power === 0) continue;

                const coil = Coils[c];
                const cStart = coil.Offset;
                const cEnd = coil.Offset + coil.Width;

                const fieldMargin = 3.0;
                const overlap = Math.max(0, Math.min(aEnd, cEnd + fieldMargin) - Math.max(aStart, cStart - fieldMargin));
                const ratio = overlap / Math.min(width, coil.Width + fieldMargin * 2);

                mag += ratio * power;
            }
            return Math.max(-1, Math.min(1, mag));
        }

        // 3. Взаимное притяжение соседних несомкнутых сердечников через зазор
        function calcPairInteraction(leftGroup, rightGroup, couplingCoef = 0.4) {
            const gap = rightGroup.offset - (leftGroup.offset + leftGroup.width);
            if (gap <= 0.001 || gap > 15) return 0;

            const magProduct = leftGroup.magnetization * rightGroup.magnetization;
            const distanceFactor = 1 / Math.pow(1 + gap / 1.5, 2);

            return magProduct * distanceFactor * couplingCoef;
        }

        // 4. Расчет сил для одной фазы (с объединением сомкнутых сердечников)
        function recalculatePhase(phaseKey) {
            const phase = phasesData[phaseKey];
            if (!phase) return;

            const mergedGroups = [];
            const EPSILON = 0.001;

            for (let i = 0; i < phase.anchors.length; i++) {
                const curr = phase.anchors[i];
                if (mergedGroups.length === 0) {
                    mergedGroups.push({
                        ids: [curr.id],
                        offset: curr.offset,
                        width: curr.width,
                        height: curr.height,
                        magnetization: 0,
                        externalForce: 0,
                        force: 0
                    });
                } else {
                    const lastGroup = mergedGroups[mergedGroups.length - 1];
                    const lastEnd = lastGroup.offset + lastGroup.width;

                    if (Math.abs(lastEnd - curr.offset) <= EPSILON) {
                        lastGroup.ids.push(curr.id);
                        lastGroup.width += curr.width;
                    } else {
                        mergedGroups.push({
                            ids: [curr.id],
                            offset: curr.offset,
                            width: curr.width,
                            height: curr.height,
                            magnetization: 0,
                            externalForce: 0,
                            force: 0
                        });
                    }
                }
            }

            let rawTotalExternalForce = 0;

            mergedGroups.forEach(group => {
                group.magnetization = calcMagnetization(group.offset, group.width, phase);
                let coilForce = 0;
                for (let c = 0; c < Coils.length; c++) {
                    const power = phase.coilPowers[c] ?? 0;
                    coilForce += calcSingleCoilForce(Coils[c], group.offset, group.width, power);
                }
                group.externalForce = coilForce;
                group.force = coilForce;
                rawTotalExternalForce += coilForce;
            });

            // Взаимное внутреннее притяжение между соседними несомкнутыми кластерами
            for (let i = 0; i < mergedGroups.length - 1; i++) {
                const leftG = mergedGroups[i];
                const rightG = mergedGroups[i + 1];
                const pairForce = calcPairInteraction(leftG, rightG);

                leftG.force += pairForce;
                rightG.force -= pairForce;
            }

            mergedGroups.forEach(group => {
                group.force = Math.max(-1, Math.min(1, Number(group.force.toFixed(3))));
            });

            phase.mergedAnchors = mergedGroups;
            // Суммарная внешняя тяга системы (внутренние силы между якорями взаимно компенсируются)
            phase.totalSystemForce = Number(rawTotalExternalForce.toFixed(3));
        }

        // 5. Автоматический подбор мощностей катушек (0..100%) для максимальной тяги вправо
        function optimizeAllPhasesForMaxRightForce() {
            for (const key in phasesData) {
                const phaseKey = parseInt(key, 10);
                const phase = phasesData[phaseKey];
                if (!phase) continue;

                // Для каждой катушки считаем её чистый вклад в тягу всех кластеров при 100% мощности.
                // Если катушка в сумме тянет систему вправо (> 0) — включаем на 100% (1.0),
                // если тормозит или вклад нулевой (<= 0) — выключаем в 0% (0.0).
                for (let c = 0; c < Coils.length; c++) {
                    let coilContribution = 0;
                    phase.mergedAnchors.forEach(group => {
                        coilContribution += calcSingleCoilForce(Coils[c], group.offset, group.width, 1.0);
                    });

                    phase.coilPowers[c] = coilContribution > 0.001 ? 1.0 : 0.0;
                }

                recalculatePhase(phaseKey);
            }
        }

        // 6. Построение словаря всех фаз
        function buildAllPhases() {
            phasesData = {};
            const maxStep = parseInt(sldProgress.max, 10);

            for (let step = 0; step <= maxStep; step++) {
                const coilPowers = new Array(Coils.length).fill(1.0);
                let moveLim = params.tubeWidth.value;
                const phaseAnchors = new Array(Anchors.length);

                for (let i = Anchors.length - 1; i >= 0; --i) {
                    moveLim -= Anchors[i].Width;
                    let pos = Anchors[i].StartOffset + step;
                    if (pos > moveLim) pos = moveLim;

                    phaseAnchors[i] = {
                        id: Anchors[i].Id,
                        offset: pos,
                        width: Anchors[i].Width,
                        height: Anchors[i].Height
                    };
                }

                phasesData[step] = {
                    offset: step,
                    coilPowers: coilPowers,
                    anchors: phaseAnchors,
                    mergedAnchors: [],
                    totalSystemForce: 0
                };

                recalculatePhase(step);
            }

            // Автоматически рассчитываем оптимальную циклограмму катушек для всех фаз
            optimizeAllPhasesForMaxRightForce();
        }

        function buildForm() {
            paramsHolder.innerHTML = '';
            for (const key in params) {
                const item = params[key];
                const label = document.createElement('label');
                label.textContent = item.label + ':';
                label.htmlFor = 'param_' + key;

                const input = document.createElement('input');
                input.type = 'number';
                input.id = 'param_' + key;
                input.value = item.value;
                input.step = item.step;
                if (item.min !== undefined) input.min = item.min;

                input.addEventListener('input', function () {
                    const parsed = item.isInt ? parseInt(this.value, 10) : parseFloat(this.value);
                    if (!isNaN(parsed)) {
                        params[key].value = parsed;
                        resetParams();
                        buildAllPhases();
                        applyPhase(parseInt(sldProgress.value, 10));
                    }
                });

                paramsHolder.appendChild(label);
                paramsHolder.appendChild(input);
            }
        }

        function init() {
            infoRow.className = 'info-row';
            infoStats.className = 'info-stats';

            btnToggleChart.textContent = '📈 График суммарной тяги';
            btnToggleChart.addEventListener('click', () => {
                showForceChart = !showForceChart;
                btnToggleChart.classList.toggle('active', showForceChart);
                draw(parseInt(sldProgress.value, 10));
            });

            infoRow.appendChild(infoStats);
            infoRow.appendChild(btnToggleChart);

            const sliderRow = document.createElement('div');
            sliderRow.className = 'slider-row';

            const btnPrev = document.createElement('button');
            btnPrev.textContent = '◀';
            btnPrev.title = 'Предыдущая фаза (-1)';
            btnPrev.addEventListener('click', () => {
                const cur = parseInt(sldProgress.value, 10);
                if (cur > 0) {
                    sldProgress.value = cur - 1;
                    applyPhase(cur - 1);
                }
            });

            const btnNext = document.createElement('button');
            btnNext.textContent = '▶';
            btnNext.title = 'Следующая фаза (+1)';
            btnNext.addEventListener('click', () => {
                const cur = parseInt(sldProgress.value, 10);
                const max = parseInt(sldProgress.max, 10);
                if (cur < max) {
                    sldProgress.value = cur + 1;
                    applyPhase(cur + 1);
                }
            });

            sliderRow.appendChild(btnPrev);
            sliderRow.appendChild(sldProgress);
            sliderRow.appendChild(btnNext);

            resultsHolder.appendChild(infoRow);
            resultsHolder.appendChild(sliderRow);

            new ResizeObserver(entries => {
                const { width, height } = entries[0].contentRect;
                const dpr = window.devicePixelRatio || 1;
                cvsDisplay.width = Math.floor(width * dpr);
                cvsDisplay.height = Math.floor(height * dpr);
                draw(parseInt(sldProgress.value, 10));
            }).observe(cvsWrapper);
        }

        function resetParams() {
            Coils = [];
            Anchors = [];

            const maxOffset = params.tubeWidth.value - params.anchorsCount.value * params.anchorsWidth.value;
            sldProgress.max = Math.max(0, Math.ceil(maxOffset));
            if (parseInt(sldProgress.value, 10) > sldProgress.max) {
                sldProgress.value = sldProgress.max;
            }

            const coilH = params.tubeOutHeight.value + params.coilWireSize.value * params.coilWireLayers.value * 2;
            let offset = params.coilOffset.value;
            for (let i = 0; i < params.coilsCount.value; ++i) {
                Coils.push({
                    Id: i + 1,
                    Height: coilH,
                    Width: params.coilWidth.value,
                    Offset: offset
                });
                offset += params.coilWidth.value + params.coilStep.value;
            }

            offset = params.anchorsOffset.value;
            for (let i = 0; i < params.anchorsCount.value; ++i) {
                Anchors.push({
                    Id: i + 1,
                    Height: params.anchorsHeight.value,
                    Width: params.anchorsWidth.value,
                    Offset: offset,
                    StartOffset: offset
                });
                offset += params.anchorsWidth.value + params.anchorsStep.value;
            }
        }

        function applyPhase(phaseKey) {
            const phase = phasesData[phaseKey];
            if (!phase) return;

            for (let i = 0; i < Anchors.length; i++) {
                Anchors[i].Offset = phase.anchors[i].offset;
            }

            const anchorsText = phase.mergedAnchors.map(g => {
                const arrow = g.force > 0.005 ? '→' : (g.force < -0.005 ? '←' : '•');
                const sign = g.force > 0 ? '+' : '';
                const name = g.ids.length > 1 ? `Сборка #${g.ids.join('+')}` : `Якорь #${g.ids}`;
                return `${name}: <b>${sign}${g.force.toFixed(2)}</b> ${arrow}`;
            }).join(' &nbsp;|&nbsp; ');

            const coilsText = phase.coilPowers
                .map((p, idx) => `К${idx + 1}: ${Math.round(p * 100)}%`)
                .join(' ');

            infoStats.innerHTML = `
                <span>Фаза: <b>${phaseKey}</b> / ${sldProgress.max}</span>
                <span>${anchorsText}</span>
                <span>Суммарная тяга: <b>${phase.totalSystemForce > 0 ? '+' : ''}${phase.totalSystemForce.toFixed(2)}</b></span>
                <span class="badge-coils">[${coilsText}]</span>
            `;

            draw(phaseKey);
        }

        function drawRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawTextWithBg(text, x, y, textColor, bgColor = 'rgba(38, 38, 38, 0.9)', paddingX = 6, paddingY = 3) {
            ctx.save();
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const textWidth = ctx.measureText(text).width;
            const textHeight = 14;
            const boxWidth = textWidth + paddingX * 2;
            const boxHeight = textHeight + paddingY * 2;

            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(x - boxWidth / 2, y - boxHeight / 2, boxWidth, boxHeight, 4);
            ctx.fill();

            ctx.fillStyle = textColor;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        // Отрисовка графика суммарной тяги по всем фазам в нижней части canvas
        function drawForceChart(logicalWidth, logicalHeight, currentPhaseKey) {
            const keys = Object.keys(phasesData).map(Number).sort((a, b) => a - b);
            if (keys.length < 2) return;

            const padLeft = 46;
            const padRight = 20;
            const padBottom = 24;
            const chartHeight = Math.min(165, Math.max(95, logicalHeight * 0.30));
            const chartTop = logicalHeight - chartHeight - padBottom;
            const chartWidth = logicalWidth - padLeft - padRight;

            if (chartWidth <= 20) return;

            const forces = keys.map(k => phasesData[k].totalSystemForce);
            const maxForce = Math.max(1.0, ...forces);
            const minForce = Math.min(0, ...forces);
            const range = (maxForce - minForce) || 1;

            ctx.save();

            // Полупрозрачная подложка графика
            ctx.fillStyle = 'rgba(20, 20, 24, 0.92)';
            ctx.strokeStyle = '#3f3f46';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(padLeft - 36, chartTop - 22, chartWidth + 46, chartHeight + 40, 6);
            ctx.fill();
            ctx.stroke();

            // Заголовок графика
            ctx.fillStyle = '#a1a1aa';
            ctx.font = 'bold 11px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('График суммарной тяги системы по фазам (+X)', padLeft, chartTop - 8);

            // Горизонтальная сетка и подписи оси Y
            const yZero = chartTop + ((maxForce - 0) / range) * chartHeight;
            ctx.strokeStyle = '#333338';
            ctx.lineWidth = 1;
            ctx.font = '10px monospace';
            ctx.fillStyle = '#71717a';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            const gridSteps = 4;
            for (let s = 0; s <= gridSteps; s++) {
                const val = minForce + (range * s) / gridSteps;
                const gy = chartTop + chartHeight - (s / gridSteps) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(padLeft, gy);
                ctx.lineTo(padLeft + chartWidth, gy);
                ctx.stroke();
                ctx.fillText(val.toFixed(2), padLeft - 6, gy);
            }

            // Нулевая линия
            ctx.strokeStyle = '#52525b';
            ctx.beginPath();
            ctx.moveTo(padLeft, yZero);
            ctx.lineTo(padLeft + chartWidth, yZero);
            ctx.stroke();

            // Заливка под кривой тяги
            const getX = idx => padLeft + (idx / (keys.length - 1)) * chartWidth;
            const getY = val => chartTop + ((maxForce - val) / range) * chartHeight;

            ctx.beginPath();
            ctx.moveTo(getX(0), yZero);
            keys.forEach((k, idx) => {
                ctx.lineTo(getX(idx), getY(phasesData[k].totalSystemForce));
            });
            ctx.lineTo(getX(keys.length - 1), yZero);
            ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.16)';
            ctx.fill();

            // Линия графика
            ctx.beginPath();
            keys.forEach((k, idx) => {
                const px = getX(idx);
                const py = getY(phasesData[k].totalSystemForce);
                if (idx === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Маркер текущей фазы на графике
            const curIdx = keys.indexOf(currentPhaseKey);
            if (curIdx !== -1) {
                const cx = getX(curIdx);
                const cy = getY(phasesData[currentPhaseKey].totalSystemForce);

                ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(cx, chartTop);
                ctx.lineTo(cx, chartTop + chartHeight);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Подписи оси X (начало, середина, конец)
            ctx.fillStyle = '#71717a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('0', padLeft, chartTop + chartHeight + 4);
            const midIdx = Math.floor((keys.length - 1) / 2);
            ctx.fillText(String(keys[midIdx]), getX(midIdx), chartTop + chartHeight + 4);
            ctx.fillText(String(keys[keys.length - 1]), padLeft + chartWidth, chartTop + chartHeight + 4);

            ctx.restore();
        }

        function draw(phaseKey = 0) {
            const dpr = window.devicePixelRatio || 1;
            const logicalWidth = cvsDisplay.width / dpr;
            const logicalHeight = cvsDisplay.height / dpr;

            ctx.save();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            const mmPx = logicalWidth / params.tubeWidth.value;
            const phase = phasesData[phaseKey];

            // Если график открыт, слегка приподнимаем чертеж трубки вверх, чтобы они не перекрывались
            const centerY = showForceChart ? logicalHeight * 0.30 : logicalHeight * 0.50;

            // 1. Катушки и их автоматически рассчитанная мощность снизу
            for (let i = 0; i < Coils.length; ++i) {
                const pwr = phase ? Math.abs(phase.coilPowers[i]) : 1;
                const cx = Coils[i].Offset * mmPx;
                const cw = Coils[i].Width * mmPx;
                const ch = mmPx * Coils[i].Height;
                const cy = centerY - ch / 2;

                ctx.globalAlpha = 0.22 + 0.78 * pwr;
                drawRect(cx, cy, cw, ch, '#EA3');
                ctx.globalAlpha = 1.0;

                const pct = Math.round(pwr * 100);
                const pwrColor = pct === 0 ? '#737373' : '#fbbf24';
                drawTextWithBg(`К${i + 1}: ${pct}%`, cx + cw / 2, cy + ch + 16, pwrColor, 'rgba(30, 30, 30, 0.85)');
            }

            // 2. Внешний и внутренний контуры трубки
            drawRect(
                0,
                centerY - (mmPx * params.tubeOutHeight.value) / 2,
                logicalWidth,
                mmPx * params.tubeOutHeight.value,
                '#CCC'
            );
            drawRect(
                0,
                centerY - (mmPx * params.tubeInHeight.value) / 2,
                logicalWidth,
                mmPx * params.tubeInHeight.value,
                '#888'
            );

            // 3. Якоря (с учетом магнитного слияния и плашек с силой тяги сверху)
            const groups = phase ? phase.mergedAnchors : [];
            for (let i = 0; i < groups.length; ++i) {
                const g = groups[i];
                const gx = g.offset * mmPx;
                const gw = g.width * mmPx;
                const gh = mmPx * g.height;
                const gy = centerY - gh / 2;

                drawRect(gx, gy, gw, gh, '#3ae');

                if (g.ids.length > 1) {
                    ctx.strokeStyle = 'rgba(15, 23, 42, 0.55)';
                    ctx.lineWidth = 1;
                    let segX = gx;
                    for (let k = 0; k < g.ids.length - 1; k++) {
                        const segAnchor = Anchors.find(a => a.Id === g.ids[k]);
                        segX += segAnchor.Width * mmPx;
                        ctx.beginPath();
                        ctx.moveTo(segX, gy);
                        ctx.lineTo(segX, gy + gh);
                        ctx.stroke();
                    }
                }

                const f = g.force ?? 0;
                const textColor = f > 0.01 ? '#4ade80' : (f < -0.01 ? '#f87171' : '#e5e5e5');
                const prefix = g.ids.length > 1 ? `[${g.ids.join('+')}] ` : '';
                const labelText = `${prefix}${f > 0 ? '+' : ''}${f.toFixed(2)}`;

                drawTextWithBg(labelText, gx + gw / 2, gy - 16, textColor, 'rgba(38, 38, 38, 0.92)');
            }

            // 4. График суммарной тяги (если включен кнопкой)
            if (showForceChart) {
                drawForceChart(logicalWidth, logicalHeight, phaseKey);
            }

            ctx.restore();
        }

        sldProgress.addEventListener('input', function () {
            applyPhase(parseInt(this.value, 10));
        });

        buildForm();
        init();
        resetParams();
        buildAllPhases();
        applyPhase(0);
    </script>
</body>
</html>
